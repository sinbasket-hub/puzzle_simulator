<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Noto+Sans+JP:wght@700;900&display=swap');

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
    }

    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans JP', sans-serif;
      background: #18191c radial-gradient(circle at 50% 50%, #22252a 0%, #111215 100%);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
    }

    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }

    .start-title {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(180deg, #fde047 0%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(202, 138, 4, 0.4);
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .start-btn {
      background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
      border: 3px solid #fde047;
      color: #0f172a;
      font-size: 1.25rem;
      font-weight: 900;
      padding: 12px 36px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.5);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.1s ease, filter 0.1s ease;
      animation: pulseBtn 1.5s infinite;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(234, 179, 8, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }

    .board-container {
      background: #1d1e22;
      border: 3px solid #2d3037;
      border-radius: 12px;
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.8),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
      position: relative;
      padding: 4px;
      touch-action: none;
    }

    .grid-background {
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      display: grid;
      gap: 2px;
      pointer-events: none;
      z-index: 1;
    }

    .grid-cell {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 4px 6px rgba(255, 255, 255, 0.75),
        inset 0 -6px 10px rgba(0, 0, 0, 0.65),
        0 4px 8px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s ease-out, opacity 0.15s ease;
      cursor: grab;
      will-change: left, top;
      z-index: 10;
      touch-action: none;
      pointer-events: auto;
    }

    .orb::before {
      content: '';
      position: absolute;
      top: 6%;
      left: 18%;
      width: 64%;
      height: 32%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 50%;
      pointer-events: none;
    }

    .orb.dragging {
      z-index: 1000 !important;
      cursor: grabbing;
      transform: scale(1.18);
      transition: none !important;
      box-shadow: 
        inset 0 6px 10px rgba(255, 255, 255, 0.9),
        inset 0 -10px 14px rgba(0, 0, 0, 0.7),
        0 15px 30px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(255, 255, 255, 0.5);
    }

    .orb-fire { background: radial-gradient(circle at 35% 30%, #ff5252 0%, #d32f2f 60%, #850000 100%); }
    .orb-water { background: radial-gradient(circle at 35% 30%, #40c4ff 0%, #0288d1 60%, #004b87 100%); }
    .orb-wood { background: radial-gradient(circle at 35% 30%, #69f0ae 0%, #388e3c 60%, #1b5e20 100%); }
    .orb-light { background: radial-gradient(circle at 35% 30%, #ffff8d 0%, #fbc02d 60%, #9a6700 100%); }
    .orb-dark { background: radial-gradient(circle at 35% 30%, #e040fb 0%, #7b1fa2 60%, #4a0072 100%); }
    
    .orb-heal { 
      background: radial-gradient(circle at 35% 30%, #ff80ab 0%, #c2185b 60%, #70002b 100%); 
      border-radius: 20%;
    }
    .orb-heal::before {
      border-radius: 20%;
    }

    .orb svg {
      width: 58%;
      height: 58%;
      fill: rgba(255, 255, 255, 0.88);
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
      pointer-events: none;
    }

    .panel-box {
      background: #23262c;
      border: 2px solid #32363f;
      border-radius: 10px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .btn-custom {
      background: linear-gradient(180deg, #444a57 0%, #2b2f38 100%);
      border: 2px solid #545b6a;
      border-radius: 8px;
      color: #e2e8f0;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .btn-custom:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .btn-active {
      background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
      border-color: #fde047;
      color: #0f172a;
      text-shadow: none;
    }

    .palette-item {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
    }

    .palette-item.orb-heal {
      border-radius: 20%;
    }

    .palette-item.selected {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    .palette-item svg {
      width: 60%;
      height: 60%;
      fill: #ffffff;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-track {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 22px;
      border: 1px solid #4b5563;
    }

    .slider-track:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-track {
      background-color: #eab308;
      border-color: #fde047;
    }

    input:checked + .slider-track:before {
      transform: translateX(18px);
      background-color: #0f172a;
    }

    @keyframes comboPop {
      0% { transform: scale(0.3) translateY(10px) rotate(-5deg); opacity: 0; }
      50% { transform: scale(1.2) translateY(-10px) rotate(3deg); opacity: 1; }
      100% { transform: scale(1.0) translateY(-20px) rotate(0deg); opacity: 1; }
    }

    .combo-popup {
      animation: comboPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      pointer-events: none;
      position: absolute;
      z-index: 2000;
      text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 10px currentColor;
    }

    .timer-bar-fill {
      transition: width 0.05s linear;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.8);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    /* 共有閲覧モード専用スタイル */
    body.shared-view-mode .interactive-controls-panel {
      display: none !important;
    }
    body.shared-view-mode .orb {
      pointer-events: none !important;
      cursor: default !important;
    }
    body.shared-view-mode #board-grid {
      pointer-events: none !important;
    }
  </style>
</head>
<body class="w-full h-full">

  <div id="start-screen">
    <div class="text-center px-4" style="position: relative; z-index: 10000;">
      <h1 class="start-title">PUZZLE SIMULATOR</h1>
      <button id="btn-game-start" class="start-btn">GAME START</button>
    </div>
  </div>

  <div class="w-full max-w-sm md:max-w-xl flex flex-col justify-between items-center h-full py-1">
    <div class="w-full flex flex-col gap-1.5">
      <div class="panel-box p-2 flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <h1 class="text-xs font-black text-amber-100 tracking-wider">
            PUZZLE SIMULATOR
          </h1>
          <div class="flex items-center gap-1">
            <span id="replay-status-badge" class="hidden text-[9px] bg-amber-600/90 text-amber-100 border border-amber-400 px-1.5 py-0.2 rounded font-bold animate-pulse">🎬 再生中</span>
            <span id="shared-mode-badge" class="hidden text-[9px] bg-blue-600/90 text-blue-100 border border-blue-400 px-1.5 py-0.2 rounded font-bold">👀 共有リプレイ閲覧</span>
            <span id="no-skyfall-badge" class="hidden text-[9px] bg-red-900/80 text-red-200 border border-red-500/50 px-1 py-0.2 rounded font-bold">落ちコンなし</span>
          </div>
        </div>

        <div class="flex justify-between items-center text-[11px] font-bold text-slate-300 interactive-controls-panel">
          <span>タイマー: [<span id="timer-setting-label" class="text-green-400">8.0s</span>]</span>
          <span id="timer-text" class="text-green-400 text-xs font-bold">8.0s</span>
        </div>

        <div class="w-full h-2 bg-slate-900 rounded-full p-0.5 border border-slate-700/80 overflow-hidden interactive-controls-panel">
          <div id="timer-bar" class="h-full bg-gradient-to-r from-green-500 to-emerald-400 rounded-full timer-bar-fill w-full"></div>
        </div>

        <div class="flex justify-between items-center pt-0.5 border-t border-slate-700/60">
          <span class="text-[11px] font-bold text-slate-300">COMBO:</span>
          <span id="combo-display" class="text-lg font-black text-amber-400 leading-none">0</span>
        </div>
      </div>

      <!-- 共有閲覧時専用コントロールパネル（もう一度再生 ＆ 落ちコンなしトグル） -->
      <div id="shared-controls-panel" class="panel-box p-2 hidden flex-col gap-2 border-amber-500/50">
        <button id="btn-replay-again-shared" class="btn-custom py-2 px-2 text-xs uppercase tracking-wider bg-gradient-to-r from-amber-500 to-amber-600 text-slate-900 font-black shadow-lg">
          ▶️ もう一度再生 (再リプレイ)
        </button>

        <div class="flex items-center justify-between pt-1 border-t border-slate-700/60">
          <span class="text-xs font-bold text-slate-200">落ちコンなし</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-no-skyfall-shared">
            <span class="slider-track"></span>
          </label>
        </div>
      </div>

      <!-- 通常操作設定パネル（共有リンクでは非表示） -->
      <div class="panel-box p-1.5 flex flex-col gap-1 interactive-controls-panel">
        <div class="flex flex-col gap-0.5">
          <div class="flex justify-between items-center text-[11px] font-bold text-slate-300">
            <span>操作時間:</span>
            <div class="flex items-center gap-1">
              <input type="text" id="time-input" value="8" 
                     class="w-14 bg-slate-900 border border-slate-600 rounded px-1 py-0.2 text-right text-amber-300 font-bold text-xs focus:outline-none focus:border-amber-400">
              <span class="text-slate-400" id="time-unit-label">秒</span>
            </div>
          </div>
          
          <input type="range" id="time-slider" min="1" max="30" step="0.5" value="8" 
                 class="w-full accent-amber-400 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer">

          <div class="flex gap-1 justify-between">
            <button data-time="5" class="time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[9px]">5s</button>
            <button data-time="8" class="time-btn flex-1 py-0.5 rounded bg-amber-500 text-slate-900 font-bold text-[9px]">8s</button>
            <button data-time="12" class="time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[9px]">12s</button>
            <button data-time="20" class="time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[9px]">20s</button>
            <button data-time="inf" class="time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[9px]">制限なし</button>
          </div>
        </div>

        <div class="flex flex-col gap-1.5 pt-1 border-t border-slate-700/60">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-slate-200">落ちコンなし</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-no-skyfall">
              <span class="slider-track"></span>
            </label>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-slate-200">🎵 BGM (ON / OFF)</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-bgm">
              <span class="slider-track"></span>
            </label>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-slate-200">🎶 曲選択</span>
            <div class="flex gap-1">
              <button data-song="1" class="song-btn px-2 py-0.5 rounded bg-amber-500 text-slate-900 font-bold text-[9px]">Spire (道中)</button>
              <button data-song="2" class="song-btn px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[9px]">Boss (ボス)</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 通常操作ボタン（共有リンクでは非表示） -->
      <div class="grid grid-cols-2 gap-1 interactive-controls-panel">
        <button id="btn-edit-mode" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider col-span-2 text-amber-300 border-amber-500/50 flex items-center justify-center gap-1">
          ✏️ EDIT MODE (盤面編集)
        </button>
        <button id="btn-retry" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider bg-emerald-700/60 border-emerald-500/60 text-emerald-200">
          ↩️ やり直す
        </button>
        <button id="btn-reset" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider">
          🔄 リセット
        </button>
        <button id="btn-toggle-grid" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider col-span-2">
          📐 6x5 / 7x6 切替
        </button>
        <button id="btn-open-replays" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider col-span-2 bg-amber-600/40 border-amber-500/60 text-amber-200">
          📼 リプレイ管理・共有
        </button>
      </div>

      <div id="edit-palette-panel" class="panel-box p-1.5 hidden flex-col gap-1 border-amber-500/40 interactive-controls-panel">
        <div class="text-[11px] font-bold text-amber-300 flex justify-between items-center">
          <span>ペイントドロップ選択:</span>
          <button id="btn-fill-all" class="text-[9px] bg-amber-500/25 hover:bg-amber-500/40 text-amber-200 border border-amber-500/40 px-1 py-0.2 rounded">
            全埋め
          </button>
        </div>
        
        <div class="flex justify-around items-center py-0.5">
          <div class="palette-item orb-fire selected" data-type="fire"></div>
          <div class="palette-item orb-water" data-type="water"></div>
          <div class="palette-item orb-wood" data-type="wood"></div>
          <div class="palette-item orb-light" data-type="light"></div>
          <div class="palette-item orb-dark" data-type="dark"></div>
          <div class="palette-item orb-heal" data-type="heal"></div>
        </div>
      </div>
    </div>

    <!-- 盤面メイン表示（通常時・共有時ともに中央配置） -->
    <div class="flex flex-col items-center mt-1">
      <div id="board-frame" class="board-container">
        <div id="grid-background" class="grid-background"></div>
        <div id="board-grid" class="relative w-full h-full z-10"></div>
      </div>
    </div>
  </div>

  <!-- Replay Modal -->
  <div id="replay-modal" class="modal-overlay hidden">
    <div class="panel-box p-4 w-11/12 max-w-md flex flex-col gap-3 bg-[#1d1e24] border-amber-500/50 max-h-[85vh]">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h2 class="text-sm font-black text-amber-300">📼 リプレイ管理 & 共有</h2>
        <div class="flex items-center gap-2">
          <button id="btn-delete-all-replays" class="text-[10px] bg-red-900/80 hover:bg-red-800 text-red-200 border border-red-500/50 px-2 py-0.5 rounded font-bold">🗑️ すべて削除</button>
          <button id="btn-close-modal" class="text-slate-400 hover:text-white font-bold text-sm px-1">✕</button>
        </div>
      </div>

      <div class="flex flex-col gap-2 overflow-y-auto max-h-56 pr-1" id="replay-list-container">
        <div class="text-xs text-slate-400 text-center py-4">保存されたリプレイはありません</div>
      </div>

      <div class="flex flex-col gap-1.5 pt-2 border-t border-slate-700">
        <span class="text-[11px] font-bold text-slate-300">🔗 共有リンク (URL):</span>
        <div class="flex gap-1">
          <input type="text" id="share-url-input" readonly placeholder="リプレイを選択してリンクを生成" 
                 class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300 focus:outline-none">
          <button id="btn-copy-url" class="btn-custom px-3 py-1 text-xs bg-amber-500 text-slate-900 font-bold whitespace-nowrap">コピー</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.bgm1 = new Audio('Steps_to_the_Sunken_Spire.mp3');
        this.bgm2 = new Audio('The_Final_Cascade_BOSS.mp3');
        
        [this.bgm1, this.bgm2].forEach(audio => {
          audio.loop = true;
          audio.volume = 0.5;
          audio.preload = 'auto';
        });

        this.currentSongIndex = 1;
        this.isBgmEnabled = false;
      }

      getCurrentBgm() {
        return this.currentSongIndex === 1 ? this.bgm1 : this.bgm2;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      setBgmEnabled(enabled) {
        this.isBgmEnabled = enabled;
        const currentBgm = this.getCurrentBgm();
        if (!enabled) {
          currentBgm.pause();
        } else {
          if (startScreen.style.display === 'none') {
            currentBgm.play().catch(e => {});
          }
        }
      }

      switchSong(songIndex) {
        const currentBgm = this.getCurrentBgm();
        currentBgm.pause();
        currentBgm.currentTime = 0;

        this.currentSongIndex = songIndex;
        const newBgm = this.getCurrentBgm();

        if (this.isBgmEnabled && startScreen.style.display === 'none') {
          newBgm.currentTime = 0;
          newBgm.play().catch(e => {});
        }
      }

      playGrab() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e){}
      }

      playSwap() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(380, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(240, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e){}
      }

      playCombo(comboNum) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const baseFreq = 440;
          const freq = baseFreq * Math.pow(1.05946, Math.min(comboNum, 16) + 2);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.2, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch(e){}
      }

      playDrop() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e){}
      }

      playDungeonBGM() {
        if (!this.isBgmEnabled) return;
        const currentBgm = this.getCurrentBgm();
        currentBgm.currentTime = 0;
        const playPromise = currentBgm.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {});
        }
      }

    function calculateOrbSize() {
      const maxWidth = Math.min(window.innerWidth - 16, 420);
      orbSize = Math.floor((maxWidth - 8) / COLS);

      boardGrid.style.width = `${orbSize * COLS}px`;
      boardGrid.style.height = `${orbSize * ROWS}px`;
      boardFrame.style.width = `${orbSize * COLS + 8}px`;
      boardFrame.style.height = `${orbSize * ROWS + 8}px`;

      gridBackground.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
      gridBackground.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
      gridBackground.innerHTML = '';
      for (let i = 0; i < COLS * ROWS; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        gridBackground.appendChild(cell);
      }
    }

    function initBoard(presetTypes = null) {
      if (isProcessingCombos || isReplaying || isSharedView) return;
      calculateOrbSize();
      boardGrid.innerHTML = '';
      
      gridMatrix = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      comboCount = 0;
      comboDisplay.textContent = '0';
      recordedFramePath = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const type = presetTypes ? presetTypes[r][c] : ORB_TYPES[Math.floor(Math.random() * ORB_TYPES.length)];
          const orb = createOrbElement(type, r, c);
          gridMatrix[r][c] = orb;
        }
      }
      syncOrbPositions(false);
      resetTimer();

      saveInitialBoardState();
    }

    function saveInitialBoardState() {
      currentInitialBoard = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (gridMatrix[r][c]) {
            currentInitialBoard.push({ type: gridMatrix[r][c].type, row: r, col: c });
          }
        }
      }
    }

    function retryCurrentBoard() {
      if (isProcessingCombos || isReplaying || isSharedView) return;
      boardGrid.innerHTML = '';
      
      gridMatrix = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      comboCount = 0;
      comboDisplay.textContent = '0';
      recordedFramePath = [];

      currentInitialBoard.forEach(item => {
        if (item.row < ROWS && item.col < COLS) {
          const orb = createOrbElement(item.type, item.row, item.col);
          gridMatrix[item.row][item.col] = orb;
        }
      });

      syncOrbPositions(false);
      resetTimer();
      sfx.playSwap();
    }

    function createOrbElement(type, row, col) {
      const el = document.createElement('div');
      el.className = `orb orb-${type}`;
      el.style.width = `${orbSize - 4}px`;
      el.style.height = `${orbSize - 4}px`;
      el.innerHTML = ORB_SVGS[type];

      const orbObj = {
        id: ++orbIdCounter,
        type: type,
        row: row,
        col: col,
        element: el
      };

      boardGrid.appendChild(el);
      return orbObj;
    }

    function changeOrbType(orb, newType) {
      orb.type = newType;
      orb.element.className = `orb orb-${newType}`;
      orb.element.innerHTML = ORB_SVGS[newType];
    }

    function syncOrbPositions(animated = true) {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const orb = gridMatrix[r][c];
          if (orb) {
            orb.row = r;
            orb.col = c;
            if (orb === activeOrb && isDragging) continue;

            const x = c * orbSize + 2;
            const y = r * orbSize + 2;

            if (!animated) {
              orb.element.style.transition = 'none';
            } else {
              orb.element.style.transition = 'left 0.08s cubic-bezier(0.1, 0, 0, 1), top 0.08s cubic-bezier(0.1, 0, 0, 1)';
            }
            orb.element.style.left = `${x}px`;
            orb.element.style.top = `${y}px`;
            orb.element.style.zIndex = r * COLS + c;
          }
        }
      }
    }

    function cleanupAllListeners() {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', onPointerUp);
      window.removeEventListener('touchcancel', onPointerUp);

      window.removeEventListener('pointermove', onEditPaintMove);
      window.removeEventListener('touchmove', onEditPaintTouchMove);
      window.removeEventListener('pointerup', onEditPaintEnd);
      window.removeEventListener('touchend', onEditPaintEnd);
    }

    function onPointerDown(e) {
      if (isProcessingCombos || isReplaying || isDragging || isSharedView) return;
      
      cleanupAllListeners();
      sfx.init();

      const rect = boardGrid.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const col = Math.floor((clientX - rect.left) / orbSize);
      const row = Math.floor((clientY - rect.top) / orbSize);

      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

      const orb = gridMatrix[row][col];
      if (!orb) return;

      if (isEditMode) {
        paintOrbAtLocation(clientX, clientY);
        window.addEventListener('pointermove', onEditPaintMove);
        window.addEventListener('touchmove', onEditPaintTouchMove, { passive: false });
        window.addEventListener('pointerup', onEditPaintEnd);
        window.addEventListener('touchend', onEditPaintEnd);
        return;
      }

      isDragging = true;
      activeOrb = orb;
      activeOrb.element.classList.add('dragging');

      sfx.playGrab();
      startTimer();

      dragStartTime = Date.now();
      recordedFramePath = [];

      dragPointerMove(clientX, clientY);

      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp, { once: true });
      window.addEventListener('pointercancel', onPointerUp, { once: true });
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', onPointerUp, { once: true });
      window.addEventListener('touchcancel', onPointerUp, { once: true });
    }

    function paintOrbAtLocation(clientX, clientY) {
      if (isSharedView) return;
      const rect = boardGrid.getBoundingClientRect();
      const col = Math.floor((clientX - rect.left) / orbSize);
      const row = Math.floor((clientY - rect.top) / orbSize);

      if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
        const orb = gridMatrix[row][col];
        if (orb && orb.type !== selectedPaintType) {
          changeOrbType(orb, selectedPaintType);
          sfx.playSwap();
        }
      }
    }

    function onEditPaintMove(e) {
      paintOrbAtLocation(e.clientX, e.clientY);
    }

    function onEditPaintTouchMove(e) {
      if (e.cancelable) e.preventDefault();
      paintOrbAtLocation(e.touches[0].clientX, e.touches[0].clientY);
    }

    function onEditPaintEnd() {
      cleanupAllListeners();
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();
      dragPointerMove(e.clientX, e.clientY);
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();
      dragPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }

    function dragPointerMove(clientX, clientY) {
      if (!isDragging || !activeOrb) return;

      const rect = boardGrid.getBoundingClientRect();
      const x = clientX - rect.left - (orbSize / 2);
      const y = clientY - rect.top - (orbSize / 2);

      activeOrb.element.style.left = `${x}px`;
      activeOrb.element.style.top = `${y}px`;

      const relX = clientX - rect.left;
      const relY = clientY - rect.top;
      const elapsed = Date.now() - dragStartTime;
      recordedFramePath.push({ t: elapsed, x: Math.round(relX * 10) / 10, y: Math.round(relY * 10) / 10 });

      const centerCol = Math.max(0, Math.min(COLS - 1, Math.floor((clientX - rect.left) / orbSize)));
      const centerRow = Math.max(0, Math.min(ROWS - 1, Math.floor((clientY - rect.top) / orbSize)));

      if (centerCol !== activeOrb.col || centerRow !== activeOrb.row) {
        const targetOrb = gridMatrix[centerRow][centerCol];
        if (targetOrb && targetOrb !== activeOrb) {
          const oldRow = activeOrb.row;
          const oldCol = activeOrb.col;

          gridMatrix[oldRow][oldCol] = targetOrb;
          gridMatrix[centerRow][centerCol] = activeOrb;

          sfx.playSwap();
          syncOrbPositions(true);
        }
      }
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      stopTimer();
      cleanupAllListeners();

      if (activeOrb) {
        activeOrb.element.classList.remove('dragging');
        syncOrbPositions(true);
        activeOrb = null;
      }

      if (recordedFramePath.length > 1 && !isSharedView) {
        saveCurrentReplay();
      }

      processBoardCombos();
    }

    function saveCurrentReplay() {
      const replayData = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        cols: COLS,
        rows: ROWS,
        initialBoard: currentInitialBoard,
        path: recordedFramePath

      let saved = [];

        const stored = localStorage.getItem('puzzle_sim_replays');

      saved.unshift(replayData);

      try {

    function startTimer() {
      if (isInfiniteTime || isSharedView) return;
      timeRemaining = maxMoveTime;
      updateTimerUI();

      clearInterval(timerInterval);
      const startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        timeRemaining = Math.max(0, maxMoveTime - elapsed);
        updateTimerUI();

        if (timeRemaining <= 0) {
          onPointerUp();
        }
      }, 30);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function resetTimer() {
      stopTimer();
      timeRemaining = isInfiniteTime ? 0 : maxMoveTime;
      updateTimerUI();

    function updateTimerUI() {
      if (isInfiniteTime) {
        timerText.textContent = '∞';

        timerBar.style.width = `${percent}%`;

    function setCustomMoveTime(val) {
      if (val === 'inf') {
        isInfiniteTime = true;

        if (isNaN(numVal) || numVal < 0.5) numVal = 0.5;

        }
      });

    function findMatches() {
      const horizontalMatches = [];
      const verticalMatches = [];

      for (let r = 0; r < ROWS; r++) {
        let matchLen = 1;
        for (let c = 0; c < COLS; c++) {
          const current = gridMatrix[r][c];
          const next = c < COLS - 1 ? gridMatrix[r][c + 1] : null;

          if (current && next && current.type === next.type) {
            matchLen++;
          } else {
            if (matchLen >= 3) {
              const group = [];
              for (let k = 0; k < matchLen; k++) {
                group.push(gridMatrix[r][c - k]);
              }
              horizontalMatches.push(group);
            }
            matchLen = 1;
          }
        }
      }

      for (let c = 0; c < COLS; c++) {
        let matchLen = 1;
        for (let r = 0; r < ROWS; r++) {
          const current = gridMatrix[r][c];
          const next = r < ROWS - 1 ? gridMatrix[r + 1][c] : null;

          if (current && next && current.type === next.type) {
            matchLen++;
          } else {
            if (matchLen >= 3) {
              const group = [];
              for (let k = 0; k < matchLen; k++) {
                group.push(gridMatrix[r - k][c]);
              }
              verticalMatches.push(group);
            }
            matchLen = 1;
          }
        }
      }

      const allMatchedOrbs = new Set();
      horizontalMatches.concat(verticalMatches).forEach(group => {
        group.forEach(orb => allMatchedOrbs.add(orb));
      });

      if (allMatchedOrbs.size === 0) return [];

      const comboGroups = [];
      const visited = new Set();

      allMatchedOrbs.forEach(orb => {
        if (!visited.has(orb.id)) {
          const comboGroup = [];
          const queue = [orb];
          visited.add(orb.id);

          while (queue.length > 0) {
            const curr = queue.shift();
            comboGroup.push(curr);

            allMatchedOrbs.forEach(other => {
              if (!visited.has(other.id) && other.type === curr.type) {
                const isAdjacent = Math.abs(other.row - curr.row) + Math.abs(other.col - curr.col) === 1;
                if (isAdjacent) {
                  visited.add(other.id);
                  queue.push(other);
                }
              }
            });
          }
          comboGroups.push(comboGroup);
        }
      });

      return comboGroups;
    }

    async function processBoardCombos() {
      isProcessingCombos = true;

      while (true) {
        const matches = findMatches();

        if (matches.length === 0) {
          break;
        }

        for (const group of matches) {
          comboCount++;
          comboDisplay.textContent = comboCount;

          sfx.playCombo(comboCount);

          let avgRow = 0, avgCol = 0;
          group.forEach(orb => {
            avgRow += orb.row;
            avgCol += orb.col;
          });
          avgRow /= group.length;
          avgCol /= group.length;

          showComboText(comboCount, group[0].type, avgCol * orbSize + (orbSize / 2), avgRow * orbSize);

          group.forEach(orb => {
            orb.element.style.scale = '1.2';
            orb.element.style.opacity = '0';
          });

          await new Promise(resolve => setTimeout(resolve, 250));

          group.forEach(orb => {
            if (orb.element.parentNode) {
              orb.element.parentNode.removeChild(orb.element);
            }
            gridMatrix[orb.row][orb.col] = null;
          });

          await new Promise(resolve => setTimeout(resolve, 100));
        }

        await applyGravity();

        if (noSkyfall) {
          const nextMatches = findMatches();
          if (nextMatches.length === 0) {
            await spawnSkyfallOrbs();
            break;
          }
        } else {
          await spawnSkyfallOrbs();
        }
      }

      if (comboCount > 0) {
        await new Promise(resolve => setTimeout(resolve, 800));
        comboCount = 0;
        comboDisplay.textContent = '0';
      }

      isProcessingCombos = false;
      resetTimer();
    }

    function showComboText(number, type, x, y) {
      const popup = document.createElement('div');
      popup.className = 'combo-popup font-black italic text-lg tracking-wider';
      popup.style.left = `${Math.max(10, x - 25)}px`;
      popup.style.top = `${Math.max(10, y - 10)}px`;
      popup.style.color = TYPE_COLORS[type];
      popup.innerHTML = `<span class="text-xl">${number}</span> COMBO!`;

      boardGrid.appendChild(popup);
      setTimeout(() => {
        if (popup.parentNode) popup.parentNode.removeChild(popup);
      }, 700);
    }

    async function applyGravity() {
      let moved = false;

      for (let c = 0; c < COLS; c++) {
        let emptyRows = 0;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (gridMatrix[r][c] === null) {
            emptyRows++;
          } else if (emptyRows > 0) {
            const orb = gridMatrix[r][c];
            gridMatrix[r + emptyRows][c] = orb;
            gridMatrix[r][c] = null;
            orb.row = r + emptyRows;
            moved = true;
          }
        }
      }

      if (moved) {
        sfx.playDrop();
        syncOrbPositions(true);
        await new Promise(resolve => setTimeout(resolve, 180));
      }
    }

    async function spawnSkyfallOrbs() {
      let spawned = false;

      for (let c = 0; c < COLS; c++) {
        let emptyCount = 0;
        for (let r = 0; r < ROWS; r++) {
          if (gridMatrix[r][c] === null) emptyCount++;
        }

        for (let r = 0; r < ROWS; r++) {
          if (gridMatrix[r][c] === null) {
            const type = ORB_TYPES[Math.floor(Math.random() * ORB_TYPES.length)];
            const orb = createOrbElement(type, r, c);
            gridMatrix[r][c] = orb;
            spawned = true;
          }
        }
      }

      if (spawned) {
        await new Promise(resolve => setTimeout(resolve, 40));
        sfx.playDrop();
        syncOrbPositions(true);
        await new Promise(resolve => setTimeout(resolve, 220));
      }
    }

    async function loadAndPlayReplay(replay, isFromSharedUrl = false) {
      if (isProcessingCombos || isReplaying) return;
      isReplaying = true;
      lastLoadedReplay = replay;
      
      if (isFromSharedUrl) {
        isSharedView = true;
        document.body.classList.add('shared-view-mode');
        sharedModeBadge.classList.remove('hidden');
        sharedControlsPanel.classList.remove('hidden');
        sharedControlsPanel.classList.add('flex');
      }

      replayStatusBadge.classList.remove('hidden');
      replayModal.classList.add('hidden');

      COLS = replay.cols;
      ROWS = replay.rows;
      calculateOrbSize();

      boardGrid.innerHTML = '';
      
      gridMatrix = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      comboCount = 0;
      comboDisplay.textContent = '0';

      replay.initialBoard.forEach(item => {
        if (item.row < ROWS && item.col < COLS) {
          const orb = createOrbElement(item.type, item.row, item.col);
          gridMatrix[item.row][item.col] = orb;
        }
      });

      syncOrbPositions(false);
      resetTimer();

      await new Promise(r => setTimeout(r, 600));

      if (!replay.path || replay.path.length === 0) {
        isReplaying = false;
        replayStatusBadge.classList.add('hidden');
        processBoardCombos();
        return;
      }

      const firstPt = replay.path[0];
      const startCol = Math.max(0, Math.min(COLS - 1, Math.floor(firstPt.x / orbSize)));
      const startRow = Math.max(0, Math.min(ROWS - 1, Math.floor(firstPt.y / orbSize)));
      
      const grabbedOrb = gridMatrix[startRow][startCol] || gridMatrix[0][0];
      grabbedOrb.element.classList.add('dragging');
      sfx.playGrab();

      const startTime = performance.now();
      let lastSwapCol = grabbedOrb.col;
      let lastSwapRow = grabbedOrb.row;

      await new Promise(resolve => {
        function step(now) {
          const elapsed = now - startTime;
          
          let idx = 0;
          while (idx < replay.path.length - 1 && replay.path[idx + 1].t <= elapsed) {
            idx++;
          }

          const pt = replay.path[idx];
          const px = pt.x - (orbSize / 2);
          const py = pt.y - (orbSize / 2);

          grabbedOrb.element.style.left = `${px}px`;
          grabbedOrb.element.style.top = `${py}px`;

          const curCol = Math.max(0, Math.min(COLS - 1, Math.floor(pt.x / orbSize)));
          const curRow = Math.max(0, Math.min(ROWS - 1, Math.floor(pt.y / orbSize)));

          if (curCol !== lastSwapCol || curRow !== lastSwapRow) {
            const targetOrb = gridMatrix[curRow][curCol];
            if (targetOrb && targetOrb !== grabbedOrb) {
              const oldRow = grabbedOrb.row;
              const oldCol = grabbedOrb.col;

              gridMatrix[oldRow][oldCol] = targetOrb;
              gridMatrix[curRow][curCol] = grabbedOrb;

              sfx.playSwap();
              syncOrbPositions(true);
            }
            lastSwapCol = curCol;
            lastSwapRow = curRow;
          }

          if (idx < replay.path.length - 1) {
            requestAnimationFrame(step);
          } else {
            resolve();
          }
        }
        requestAnimationFrame(step);
      });

      grabbedOrb.element.classList.remove('dragging');
      syncOrbPositions(true);

      await new Promise(r => setTimeout(r, 200));

      isReplaying = false;
      replayStatusBadge.classList.add('hidden');
      processBoardCombos();
    }

    btnGameStart.addEventListener('click', (e) => {
      e.stopPropagation();
      sfx.init();
      sfx.playDungeonBGM();

      startScreen.style.opacity = '0';
      setTimeout(() => {
        startScreen.style.display = 'none';
        
        const urlParams = new URLSearchParams(window.location.hash.substring(1));
        const replayParam = urlParams.get('replay');
        if (replayParam) {
          try {
            const decoded = JSON.parse(decodeURIComponent(escape(atob(replayParam))));
            loadAndPlayReplay(decoded, true);
            return;
          } catch(e) {
            try {
              const decodedFallback = JSON.parse(atob(replayParam));
              loadAndPlayReplay(decodedFallback, true);
              return;
            } catch(err) {}
          }
        }

        initBoard();
      }, 400);
    });

    boardGrid.addEventListener('pointerdown', onPointerDown);

    btnRetry.addEventListener('click', () => {
      retryCurrentBoard();
    });

    btnReset.addEventListener('click', () => {
      initBoard();
    });

    btnReplayAgainShared.addEventListener('click', () => {
      if (lastLoadedReplay) {
        loadAndPlayReplay(lastLoadedReplay, true);
      }
    });

    btnToggleGrid.addEventListener('click', () => {
      if (isProcessingCombos || isReplaying || isSharedView) return;
      if (COLS === 6) {
        COLS = 7;
        ROWS = 6;
      } else {
        COLS = 6;
        ROWS = 5;
      }
      initBoard();
    });

    btnEditMode.addEventListener('click', () => {
      if (isProcessingCombos || isReplaying || isSharedView) return;
      isEditMode = !isEditMode;

      if (isEditMode) {
        btnEditMode.classList.add('btn-active');
        btnEditMode.innerHTML = '✔ DONE (編集完了)';
        editPalettePanel.classList.remove('hidden');
        editPalettePanel.classList.add('flex');
      } else {
        btnEditMode.classList.remove('btn-active');
        btnEditMode.innerHTML = '✏️ EDIT MODE (盤面編集)';
        editPalettePanel.classList.add('hidden');
        editPalettePanel.classList.remove('flex');
        saveInitialBoardState();
      }
    });

    btnOpenReplays.addEventListener('click', () => {
      if (isSharedView) return;
      renderReplayList();
      replayModal.classList.remove('hidden');
    });

    btnCloseModal.addEventListener('click', () => {
      replayModal.classList.add('hidden');
    });

    btnDeleteAllReplays.addEventListener('click', () => {
      let saved = [];
      try {
        const stored = localStorage.getItem('puzzle_sim_replays');
        if (stored) saved = JSON.parse(stored);
      } catch(e){}

      if (saved.length === 0) return;

      if (confirm('保存されているすべてのリプレイを削除しますか？')) {
        localStorage.removeItem('puzzle_sim_replays');
        renderReplayList();
      }
    });

    function renderReplayList() {
      replayListContainer.innerHTML = '';
      let saved = [];
      try {
        const stored = localStorage.getItem('puzzle_sim_replays');
        if (stored) saved = JSON.parse(stored);
      } catch(e){}

      if (saved.length === 0) {
        replayListContainer.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">保存されたリプレイはありません。<br>パズルを遊ぶと自動保存されます。</div>`;
        shareUrlInput.value = '';
        btnDeleteAllReplays.classList.add('hidden');
        return;
      }

      btnDeleteAllReplays.classList.remove('hidden');

      saved.forEach((rep, index) => {
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center bg-slate-900 border border-slate-700/80 rounded p-2 text-xs';
        item.innerHTML = `
          <div class="flex flex-col">
            <span class="font-bold text-amber-300">リプレイ #${saved.length - index} (${rep.cols}x${rep.rows})</span>
            <span class="text-[10px] text-slate-400">${rep.date} / フレーム: ${rep.path ? rep.path.length : 0}</span>
          </div>
          <div class="flex gap-1">
            <button class="btn-play-rep px-2.5 py-1 rounded bg-amber-500 text-slate-900 font-bold text-[10px]" data-index="${index}">再生</button>
            <button class="btn-share-rep px-2.5 py-1 rounded bg-blue-600 text-white font-bold text-[10px]" data-index="${index}">共有リンク</button>
            <button class="btn-del-rep px-2 py-1 rounded bg-red-900/80 text-red-200 font-bold text-[10px]" data-index="${index}">削除</button>
          </div>
        `;
        replayListContainer.appendChild(item);
      });

      document.querySelectorAll('.btn-play-rep').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.index);
          const rep = saved[idx];
          loadAndPlayReplay(rep, false);
        });
      });

      document.querySelectorAll('.btn-share-rep').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.index);
          const rep = saved[idx];
          const jsonStr = JSON.stringify(rep);
          const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
          const shareUrl = `${window.location.origin}${window.location.pathname}#replay=${base64}`;
          shareUrlInput.value = shareUrl;
          shareUrlInput.select();
        });
      });

      document.querySelectorAll('.btn-del-rep').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.index);
          saved.splice(idx, 1);
          localStorage.setItem('puzzle_sim_replays', JSON.stringify(saved));
          renderReplayList();
        });
      });
    }

    btnCopyUrl.addEventListener('click', () => {
      if (!shareUrlInput.value) return;
      shareUrlInput.select();
      navigator.clipboard.writeText(shareUrlInput.value).then(() => {
        btnCopyUrl.textContent = 'コピー完了!';
        setTimeout(() => btnCopyUrl.textContent = 'コピー', 1500);
      });
    });

    document.querySelectorAll('.palette-item').forEach(item => {
      item.innerHTML = ORB_SVGS[item.dataset.type];
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.palette-item').forEach(i => i.classList.remove('selected'));
        const target = e.currentTarget;
        target.classList.add('selected');
        selectedPaintType = target.dataset.type;
      });
    });

    btnFillAll.addEventListener('click', () => {
      if (isSharedView) return;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (gridMatrix[r][c]) {
            changeOrbType(gridMatrix[r][c], selectedPaintType);
          }
        }
      }
      sfx.playSwap();
    });

    timeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const val = e.currentTarget.dataset.index || e.currentTarget.dataset.time;
        setCustomMoveTime(val);
      });
    });

    timeInput.addEventListener('change', (e) => {
      const val = e.target.value.trim();
      if (val === '制限なし' || val === 'inf' || val === '無限') {
        setCustomMoveTime('inf');
      } else {
        setCustomMoveTime(val);
      }
    });

    timeSlider.addEventListener('input', (e) => {
      setCustomMoveTime(e.target.value);
    });

    function updateNoSkyfallState(checked) {
      noSkyfall = checked;
      toggleNoSkyfall.checked = checked;
      toggleNoSkyfallShared.checked = checked;
      if (noSkyfall) {
        noSkyfallBadge.classList.remove('hidden');
      } else {
        noSkyfallBadge.classList.add('hidden');
      }
    }

    toggleNoSkyfall.addEventListener('change', (e) => {
      updateNoSkyfallState(e.target.checked);
    });

    toggleNoSkyfallShared.addEventListener('change', (e) => {
      updateNoSkyfallState(e.target.checked);
    });

    toggleBgm.addEventListener('change', (e) => {
      sfx.setBgmEnabled(e.target.checked);
    });

    songBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const songNum = parseInt(e.currentTarget.dataset.song);
        songBtns.forEach(b => {
          b.className = 'song-btn px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[9px]';
        });
        e.currentTarget.className = 'song-btn px-2 py-0.5 rounded bg-amber-500 text-slate-900 font-bold text-[9px]';
        sfx.switchSong(songNum);
      });
    });

    window.addEventListener('resize', () => {
      calculateOrbSize();
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (gridMatrix[r][c]) {
            gridMatrix[r][c].element.style.width = `${orbSize - 4}px`;
            gridMatrix[r][c].element.style.height = `${orbSize - 4}px`;
          }
        }
      }
      syncOrbPositions(false);
    });
  </script>
</body>
</html>
