<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle & Dragons Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Noto+Sans+JP:wght@700;900&display=swap');

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
    }

    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans JP', sans-serif;
      background: #18191c radial-gradient(circle at 50% 50%, #22252a 0%, #111215 100%);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
    }

    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }

    .start-title {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(180deg, #fde047 0%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(202, 138, 4, 0.4);
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .start-btn {
      background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
      border: 3px solid #fde047;
      color: #0f172a;
      font-size: 1.25rem;
      font-weight: 900;
      padding: 12px 36px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.5);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.1s ease, filter 0.1s ease;
      animation: pulseBtn 1.5s infinite;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(234, 179, 8, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }

    .board-container {
      background: #1d1e22;
      border: 3px solid #2d3037;
      border-radius: 12px;
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.8),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
      position: relative;
      padding: 4px;
      touch-action: none;
    }

    .grid-background {
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      display: grid;
      gap: 2px;
      pointer-events: none;
      z-index: 1;
    }

    .grid-cell {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 4px 6px rgba(255, 255, 255, 0.75),
        inset 0 -6px 10px rgba(0, 0, 0, 0.65),
        0 4px 8px rgba(0, 0, 0, 0.6);
      transition: transform 0.12s ease-out, left 0.12s ease-out, top 0.12s ease-out, opacity 0.2s ease, scale 0.2s ease;
      cursor: grab;
      will-change: transform, left, top;
      z-index: 10;
      touch-action: none;
    }

    .orb::before {
      content: '';
      position: absolute;
      top: 6%;
      left: 18%;
      width: 64%;
      height: 32%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 50%;
      pointer-events: none;
    }

    .orb.dragging {
      transition: none !important;
      z-index: 1000 !important;
      cursor: grabbing;
      scale: 1.15;
      box-shadow: 
        inset 0 6px 10px rgba(255, 255, 255, 0.9),
        inset 0 -10px 14px rgba(0, 0, 0, 0.7),
        0 15px 30px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(255, 255, 255, 0.5);
    }

    .orb-fire { background: radial-gradient(circle at 35% 30%, #ff5252 0%, #d32f2f 60%, #850000 100%); }
    .orb-water { background: radial-gradient(circle at 35% 30%, #40c4ff 0%, #0288d1 60%, #004b87 100%); }
    .orb-wood { background: radial-gradient(circle at 35% 30%, #69f0ae 0%, #388e3c 60%, #1b5e20 100%); }
    .orb-light { background: radial-gradient(circle at 35% 30%, #ffff8d 0%, #fbc02d 60%, #9a6700 100%); }
    .orb-dark { background: radial-gradient(circle at 35% 30%, #e040fb 0%, #7b1fa2 60%, #4a0072 100%); }
    .orb-heal { background: radial-gradient(circle at 35% 30%, #ff80ab 0%, #c2185b 60%, #70002b 100%); }

    .orb svg {
      width: 58%;
      height: 58%;
      fill: rgba(255, 255, 255, 0.88);
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
      pointer-events: none;
    }

    .panel-box {
      background: #23262c;
      border: 2px solid #32363f;
      border-radius: 10px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .btn-custom {
      background: linear-gradient(180deg, #444a57 0%, #2b2f38 100%);
      border: 2px solid #545b6a;
      border-radius: 8px;
      color: #e2e8f0;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .btn-custom:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .btn-active {
      background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
      border-color: #fde047;
      color: #0f172a;
      text-shadow: none;
    }

    .palette-item {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
    }

    .palette-item.selected {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    .palette-item svg {
      width: 60%;
      height: 60%;
      fill: #ffffff;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-track {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 22px;
      border: 1px solid #4b5563;
    }

    .slider-track:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-track {
      background-color: #eab308;
      border-color: #fde047;
    }

    input:checked + .slider-track:before {
      transform: translateX(18px);
      background-color: #0f172a;
    }

    @keyframes comboPop {
      0% { transform: scale(0.3) translateY(10px) rotate(-5deg); opacity: 0; }
      50% { transform: scale(1.2) translateY(-10px) rotate(3deg); opacity: 1; }
      100% { transform: scale(1.0) translateY(-20px) rotate(0deg); opacity: 1; }
    }

    .combo-popup {
      animation: comboPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      pointer-events: none;
      position: absolute;
      z-index: 2000;
      text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 10px currentColor;
    }

    .timer-bar-fill {
      transition: width 0.05s linear;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.8);
    }
  </style>
</head>
<body class="w-full h-full">

  <div id="start-screen">
    <div class="text-center px-4" style="position: relative; z-index: 10000;">
      <h1 class="start-title">PUZZLE & DRAGONS<br><span class="text-xl text-slate-300 font-bold">SIMULATOR</span></h1>
      <button id="btn-game-start" class="start-btn">GAME START</button>
    </div>
  </div>

  <div class="w-full max-w-sm md:max-w-xl flex flex-col justify-between items-center h-full py-1">
    <div class="w-full flex flex-col gap-1.5">
      <div class="panel-box p-2 flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <h1 class="text-xs font-black text-amber-100 tracking-wider">
            PUZZLE & DRAGONS SIMULATOR
          </h1>
          <span id="no-skyfall-badge" class="hidden text-[9px] bg-red-900/80 text-red-200 border border-red-500/50 px-1 py-0.2 rounded font-bold">落ちコンなし</span>
        </div>

        <div class="flex justify-between items-center text-[11px] font-bold text-slate-300">
          <span>タイマー: [<span id="timer-setting-label" class="text-green-400">8.0s</span>]</span>
          <span id="timer-text" class="text-green-400 text-xs font-bold">8.0s</span>
        </div>

        <div class="w-full h-2 bg-slate-900 rounded-full p-0.5 border border-slate-700/80 overflow-hidden">
          <div id="timer-bar" class="h-full bg-gradient-to-r from-green-500 to-emerald-400 rounded-full timer-bar-fill w-full"></div>
        </div>

        <div class="flex justify-between items-center pt-0.5 border-t border-slate-700/60">

      </div>

      <div class="panel-box p-1.5 flex flex-col gap-1">

            <span>操作時間:</span>
            <div class="flex items-center gap-1">
              <input type="number" id="time-input" min="1" max="60" step="0.5" value="8" 
                     class="w-12 bg-slate-900 border border-slate-600 rounded px-1 py-0.2 text-right text-amber-300 font-bold text-xs focus:outline-none focus:border-amber-400">
              <span class="text-slate-400">秒</span>
            </div>
          </div>
          
          <input type="range" id="time-slider" min="1" max="30" step="0.5" value="8" 
                 class="w-full accent-amber-400 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer">

          <div class="flex gap-1 justify-between">
            <button data-time="5" class="time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[10px]">5s</button>
            <button data-time="8" class="time-btn flex-1 py-0.5 rounded bg-amber-500 text-slate-900 font-bold text-[10px]">8s</button>
            <button data-time="12" class="time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[10px]">12s</button>
            <button data-time="20" class="time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[10px]">20s</button>
          </div>
        </div>

        <!-- 落ちコンなし & BGM切替トグル -->
        <div class="flex flex-col gap-1 pt-1 border-t border-slate-700/60">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-slate-200">落ちコンなし</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-no-skyfall">
              <span class="slider-track"></span>
            </label>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-slate-200">🎵 BGM (ON / OFF)</span>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-bgm" checked>
              <span class="slider-track"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-1">
        <button id="btn-edit-mode" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider col-span-3 text-amber-300 border-amber-500/50 flex items-center justify-center gap-1">
          ✏️ EDIT MODE (盤面編集)
        </button>
        <button id="btn-reset" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider">
          🔄 リセット
        </button>
        <button id="btn-toggle-grid" class="btn-custom py-1 px-1 text-[11px] uppercase tracking-wider col-span-2">
          📐 6x5 / 7x6 切替
        </button>
      </div>

      <div id="edit-palette-panel" class="panel-box p-1.5 hidden flex-col gap-1 border-amber-500/40">
        <div class="text-[11px] font-bold text-amber-300 flex justify-between items-center">
          <span>ペイントドロップ選択:</span>
          <button id="btn-fill-all" class="text-[9px] bg-amber-500/25 hover:bg-amber-500/40 text-amber-200 border border-amber-500/40 px-1 py-0.2 rounded">
            全埋め
          </button>
        </div>
        
        <div class="flex justify-around items-center py-0.5">
          <div class="palette-item orb-fire selected" data-type="fire"></div>
          <div class="palette-item orb-water" data-type="water"></div>
          <div class="palette-item orb-wood" data-type="wood"></div>
          <div class="palette-item orb-light" data-type="light"></div>
          <div class="palette-item orb-dark" data-type="dark"></div>
          <div class="palette-item orb-heal" data-type="heal"></div>
        </div>
      </div>
    </div>

    <div class="flex flex-col items-center mt-1">
      <div id="board-frame" class="board-container">
        <div id="grid-background" class="grid-background"></div>
        <div id="board-grid" class="relative w-full h-full z-10"></div>
      </div>
    </div>
  </div>

  <script>
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.bgm = new Audio('ANewJourney.mp3');
        this.bgm.loop = true;
        this.bgm.volume = 0.5;
        this.bgm.preload = 'auto';
        this.isBgmEnabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      setBgmEnabled(enabled) {
        this.isBgmEnabled = enabled;
        if (!enabled) {
          this.bgm.pause();
        } else {
          // ゲームがすでに始まっていれば再生を再開
          if (startScreen.style.display === 'none') {
            this.bgm.play().catch(e => {});
          }
        }
      }

      playGrab() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e){}
      }

      playSwap() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(380, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(240, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e){}
      }

      playCombo(comboNum) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const baseFreq = 440;
          const freq = baseFreq * Math.pow(1.05946, Math.min(comboNum, 16) + 2);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.2, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch(e){}
      }

      playDrop() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e){}
      }

      playDungeonBGM() {
        if (!this.isBgmEnabled) return;
        this.bgm.currentTime = 0;
        const playPromise = this.bgm.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.log("BGMの自動再生がブロックされました", error);
          });
        }
      }
    }

    const sfx = new SoundEffects();

    const ORB_SVGS = {
      fire: `<svg viewBox="0 0 24 24"><path d="M12 2.25c0 0-5.25 5.25-5.25 10.125 0 2.9 2.35 5.25 5.25 5.25s5.25-2.35 5.25-5.25c0-4.875-5.25-10.125-5.25-10.125zm0 13.5c-1.66 0-3-1.34-3-3 0-1.8 1.8-4.2 3-5.5 1.2 1.3 3 3.7 3 5.5 0 1.66-1.34 3-3 3z"/></svg>`,
      water: `<svg viewBox="0 0 24 24"><path d="M12 2.5c0 0-6 7.2-6 11.5 0 3.31 2.69 6 6 6s6-2.69 6-6c0-4.3-6-11.5-6-11.5zm-2.5 11.5c0-1.38.56-2.63 1.46-3.54l1.04 1.04c-.64.64-1 1.52-1 2.5 0 1.93 1.57 3.5 3.5 3.5.98 0 1.86-.4 2.5-1.04l1.04 1.04c-.91.9-2.16 1.46-3.54 1.46-2.76 0-5-2.24-5-5z"/></svg>`,
      wood: `<svg viewBox="0 0 24 24"><path d="M17 3c-3 0-7 2.5-8.5 6C7 8 5 8 3 10c0 0 4 1 5.5 3.5C7 15 5 18 5 21c3 0 6.5-2 8.5-5 1.5 1 3.5 1 5.5-1 0 0-3.5-1.5-4.5-4C16.5 9 19 6 17 3z"/></svg>`,
      light: `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4.5l-1.5 3.5h3L12 2.5zm0 19l1.5-3.5h-3L12 21.5zm9.5-9.5l-3.5-1.5v3l3.5-1.5zm-19 0l3.5 1.5v-3L2.5 12zm15.46-6.04l-3.18 1.41 2.12 2.12 1.06-3.53zm-11.92 0l1.06 3.53 2.12-2.12-3.18-1.41zm11.92 11.92l-1.06-3.53-2.12 2.12 3.18 1.41zm-11.92 0l3.18-1.41-2.12-2.12-1.06 3.53z"/></svg>`,
      dark: `<svg viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0-1.9 19.8 10 10 0 1 1 11.4-11.4 10 10 0 0 0-9.5-8.4zm-2.8 14.2a4 4 0 1 1 5.2-5.2 6 6 0 0 0-5.2 5.2z"/></svg>`,
      heal: `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
    };

    let COLS = 6;
    let ROWS = 5;
    let maxMoveTime = 8.0;
    let timeRemaining = maxMoveTime;
    let isDragging = false;
    let isProcessingCombos = false;
    let isEditMode = false;
    let noSkyfall = false;
    let selectedPaintType = 'fire';
    let activeOrb = null;
    let orbSize = 50;
    let boardState = [];
    let orbIdCounter = 0;
    let comboCount = 0;
    let timerInterval = null;

    const ORB_TYPES = ['fire', 'water', 'wood', 'light', 'dark', 'heal'];
    const TYPE_COLORS = { 
      fire: '#ff5252', 
      water: '#40c4ff', 
      wood: '#69f0ae', 
      light: '#ffff8d', 
      dark: '#e040fb', 
      heal: '#ff80ab' 
    };

    const startScreen = document.getElementById('start-screen');
    const btnGameStart = document.getElementById('btn-game-start');
    const boardFrame = document.getElementById('board-frame');
    const boardGrid = document.getElementById('board-grid');
    const gridBackground = document.getElementById('grid-background');
    const comboDisplay = document.getElementById('combo-display');
    const timerText = document.getElementById('timer-text');
    const timerBar = document.getElementById('timer-bar');
    const timerSettingLabel = document.getElementById('timer-setting-label');
    const btnReset = document.getElementById('btn-reset');
    const btnToggleGrid = document.getElementById('btn-toggle-grid');
    const btnEditMode = document.getElementById('btn-edit-mode');
    const editPalettePanel = document.getElementById('edit-palette-panel');
    const btnFillAll = document.getElementById('btn-fill-all');
    const timeBtns = document.querySelectorAll('.time-btn');
    const timeInput = document.getElementById('time-input');
    const timeSlider = document.getElementById('time-slider');
    const toggleNoSkyfall = document.getElementById('toggle-no-skyfall');
    const toggleBgm = document.getElementById('toggle-bgm');
    const noSkyfallBadge = document.getElementById('no-skyfall-badge');

    function calculateOrbSize() {
      const maxWidth = Math.min(window.innerWidth - 16, 420);
      orbSize = Math.floor((maxWidth - 8) / COLS);

      boardGrid.style.width = `${orbSize * COLS}px`;
      boardGrid.style.height = `${orbSize * ROWS}px`;
      boardFrame.style.width = `${orbSize * COLS + 8}px`;
      boardFrame.style.height = `${orbSize * ROWS + 8}px`;

      gridBackground.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
      gridBackground.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
      gridBackground.innerHTML = '';
      for (let i = 0; i < COLS * ROWS; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        gridBackground.appendChild(cell);
      }
    }

    function initBoard() {
      if (isProcessingCombos) return;
      calculateOrbSize();
      boardGrid.innerHTML = '';
      boardState = [];
      comboCount = 0;
      comboDisplay.textContent = '0';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const type = ORB_TYPES[Math.floor(Math.random() * ORB_TYPES.length)];
          const orb = createOrbElement(type, r, c);
          boardState.push(orb);
        }
      }
      updateOrbPositions(false);
      resetTimer();
    }

    function createOrbElement(type, row, col) {
      const el = document.createElement('div');
      el.className = `orb orb-${type}`;
      el.style.width = `${orbSize - 4}px`;
      el.style.height = `${orbSize - 4}px`;
      el.innerHTML = ORB_SVGS[type];

      const orbObj = {
        id: ++orbIdCounter,
        type: type,
        row: row,
        col: col,
        element: el
      };

      boardGrid.appendChild(el);
      return orbObj;
    }

    function changeOrbType(orb, newType) {
      orb.type = newType;
      orb.element.className = `orb orb-${newType}`;
      orb.element.innerHTML = ORB_SVGS[newType];
    }

    function updateOrbPositions(animated = true) {
      boardState.forEach(orb => {
        if (orb === activeOrb && isDragging) return;
        const x = orb.col * orbSize + 2;
        const y = orb.row * orbSize + 2;

        if (!animated) {
          orb.element.style.transition = 'none';
        } else {
          orb.element.style.transition = 'left 0.12s cubic-bezier(0.2, 0, 0, 1), top 0.12s cubic-bezier(0.2, 0, 0, 1), transform 0.15s ease-out';
        }
        orb.element.style.left = `${x}px`;
        orb.element.style.top = `${y}px`;
        orb.element.style.zIndex = orb.row * COLS + orb.col;
      });
    }

    function onPointerDown(e) {
      if (isProcessingCombos) return;
      sfx.init();

      const rect = boardGrid.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const col = Math.floor((clientX - rect.left) / orbSize);
      const row = Math.floor((clientY - rect.top) / orbSize);

      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

      const foundIndex = boardState.findIndex(o => o.row === row && o.col === col);
      if (foundIndex === -1) return;

      if (isEditMode) {
        paintOrbAtLocation(clientX, clientY);
        window.addEventListener('pointermove', onEditPaintMove);
        window.addEventListener('touchmove', onEditPaintTouchMove, { passive: false });
        window.addEventListener('pointerup', onEditPaintEnd);
        window.addEventListener('touchend', onEditPaintEnd);
        return;
      }

      isDragging = true;
      activeOrb = boardState[foundIndex];
      activeOrb.element.classList.add('dragging');

      sfx.playGrab();
      startTimer();

      dragPointerMove(clientX, clientY);

      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);
    }

    function paintOrbAtLocation(clientX, clientY) {
      const rect = boardGrid.getBoundingClientRect();
      const col = Math.floor((clientX - rect.left) / orbSize);
      const row = Math.floor((clientY - rect.top) / orbSize);

      if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
        const orb = boardState.find(o => o.row === row && o.col === col);
        if (orb && orb.type !== selectedPaintType) {
          changeOrbType(orb, selectedPaintType);
          sfx.playSwap();
        }
      }
    }

    function onEditPaintMove(e) {
      paintOrbAtLocation(e.clientX, e.clientY);
    }

    function onEditPaintTouchMove(e) {
      if (e.cancelable) e.preventDefault();
      paintOrbAtLocation(e.touches[0].clientX, e.touches[0].clientY);
    }

    function onEditPaintEnd() {
      window.removeEventListener('pointermove', onEditPaintMove);
      window.removeEventListener('touchmove', onEditPaintTouchMove);
      window.removeEventListener('pointerup', onEditPaintEnd);
      window.removeEventListener('touchend', onEditPaintEnd);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();
      dragPointerMove(e.clientX, e.clientY);
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();
      dragPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }

    function dragPointerMove(clientX, clientY) {
      if (!isDragging || !activeOrb) return;

      const rect = boardGrid.getBoundingClientRect();
      const x = clientX - rect.left - (orbSize / 2);
      const y = clientY - rect.top - (orbSize / 2);

      activeOrb.element.style.left = `${x}px`;
      activeOrb.element.style.top = `${y}px`;

      const centerCol = Math.max(0, Math.min(COLS - 1, Math.floor((clientX - rect.left) / orbSize)));
      const centerRow = Math.max(0, Math.min(ROWS - 1, Math.floor((clientY - rect.top) / orbSize)));

      if (centerCol !== activeOrb.col || centerRow !== activeOrb.row) {
        const targetOrb = boardState.find(o => o.row === centerRow && o.col === centerCol && o !== activeOrb);
        if (targetOrb) {
          const tempRow = activeOrb.row;
          const tempCol = activeOrb.col;

          activeOrb.row = targetOrb.row;
          activeOrb.col = targetOrb.col;

          targetOrb.row = tempRow;
          targetOrb.col = tempCol;

          sfx.playSwap();
          updateOrbPositions(true);
        }
      }
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      stopTimer();

      if (activeOrb) {
        activeOrb.element.classList.remove('dragging');
        updateOrbPositions(true);
        activeOrb = null;
      }

      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', onPointerUp);

      processBoardCombos();
    }

    function startTimer() {
      timeRemaining = maxMoveTime;
      updateTimerUI();

      clearInterval(timerInterval);
      const startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        timeRemaining = Math.max(0, maxMoveTime - elapsed);
        updateTimerUI();

        if (timeRemaining <= 0) {
          onPointerUp();
        }
      }, 30);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function resetTimer() {
      stopTimer();
      timeRemaining = maxMoveTime;
      updateTimerUI();
    }

    function updateTimerUI() {
      timerText.textContent = `${timeRemaining.toFixed(1)}s`;
      const percent = (timeRemaining / maxMoveTime) * 100;
      timerBar.style.width = `${percent}%`;
    }

    function setCustomMoveTime(val) {
      let numVal = parseFloat(val);
      if (isNaN(numVal) || numVal < 0.5) numVal = 0.5;
      if (numVal > 60) numVal = 60;

      maxMoveTime = numVal;
      timeInput.value = numVal;
      timeSlider.value = Math.min(numVal, 30);
      timerSettingLabel.textContent = `${numVal.toFixed(1)}s`;

      timeBtns.forEach(b => {
        if (parseFloat(b.dataset.time) === numVal) {
          b.className = 'time-btn flex-1 py-0.5 rounded bg-amber-500 text-slate-900 font-bold text-[10px]';
        } else {
          b.className = 'time-btn flex-1 py-0.5 rounded bg-slate-800 text-slate-300 font-bold text-[10px]';
        }
      });

      resetTimer();
    }

    function findMatches() {
      const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      boardState.forEach(orb => {
        if (orb.row >= 0 && orb.row < ROWS && orb.col >= 0 && orb.col < COLS) {
          grid[orb.row][orb.col] = orb;
        }
      });

      const horizontalMatches = [];
      const verticalMatches = [];

      for (let r = 0; r < ROWS; r++) {
        let matchLen = 1;
        for (let c = 0; c < COLS; c++) {
          const current = grid[r][c];
          const next = c < COLS - 1 ? grid[r][c + 1] : null;

          if (current && next && current.type === next.type) {
            matchLen++;
          } else {
            if (matchLen >= 3) {
              const group = [];
              for (let k = 0; k < matchLen; k++) {
                group.push(grid[r][c - k]);
              }
              horizontalMatches.push(group);
            }
            matchLen = 1;
          }
        }
      }

      for (let c = 0; c < COLS; c++) {
        let matchLen = 1;
        for (let r = 0; r < ROWS; r++) {
          const current = grid[r][c];
          const next = r < ROWS - 1 ? grid[r + 1][c] : null;

          if (current && next && current.type === next.type) {
            matchLen++;
          } else {
            if (matchLen >= 3) {
              const group = [];
              for (let k = 0; k < matchLen; k++) {
                group.push(grid[r - k][c]);
              }
              verticalMatches.push(group);
            }
            matchLen = 1;
          }
        }
      }

      const allMatchedOrbs = new Set();
      horizontalMatches.concat(verticalMatches).forEach(group => {
        group.forEach(orb => allMatchedOrbs.add(orb));
      });

      if (allMatchedOrbs.size === 0) return [];

      const comboGroups = [];
      const visited = new Set();

      allMatchedOrbs.forEach(orb => {
        if (!visited.has(orb.id)) {
          const comboGroup = [];
          const queue = [orb];
          visited.add(orb.id);

          while (queue.length > 0) {
            const curr = queue.shift();
            comboGroup.push(curr);

            allMatchedOrbs.forEach(other => {
              if (!visited.has(other.id) && other.type === curr.type) {
                const isAdjacent = Math.abs(other.row - curr.row) + Math.abs(other.col - curr.col) === 1;
                if (isAdjacent) {
                  visited.add(other.id);
                  queue.push(other);
                }
              }
            });
          }
          comboGroups.push(comboGroup);
        }
      });

      return comboGroups;
    }

    async function processBoardCombos() {
      isProcessingCombos = true;
      let boardHasMatches = true;

      while (boardHasMatches) {
        const matches = findMatches();

        if (matches.length === 0) {
          boardHasMatches = false;
          break;
        }

        for (const group of matches) {
          comboCount++;
          comboDisplay.textContent = comboCount;

          sfx.playCombo(comboCount);

          let avgRow = 0, avgCol = 0;
          group.forEach(orb => {
            avgRow += orb.row;
            avgCol += orb.col;
          });
          avgRow /= group.length;
          avgCol /= group.length;

          showComboText(comboCount, group[0].type, avgCol * orbSize + (orbSize / 2), avgRow * orbSize);

          group.forEach(orb => {
            orb.element.style.scale = '1.2';
            orb.element.style.opacity = '0';
          });

          await new Promise(resolve => setTimeout(resolve, 250));

          group.forEach(orb => {
            if (orb.element.parentNode) {
              orb.element.parentNode.removeChild(orb.element);
            }
            const idx = boardState.indexOf(orb);
            if (idx !== -1) boardState.splice(idx, 1);
          });

          await new Promise(resolve => setTimeout(resolve, 100));
        }

        await applyGravity();

        if (!noSkyfall) {
          await spawnSkyfallOrbs();
        }
      }

      if (comboCount > 0) {
        await new Promise(resolve => setTimeout(resolve, 800));
        comboCount = 0;
        comboDisplay.textContent = '0';
      }

      isProcessingCombos = false;
      resetTimer();
    }

    function showComboText(number, type, x, y) {
      const popup = document.createElement('div');
      popup.className = 'combo-popup font-black italic text-lg tracking-wider';
      popup.style.left = `${Math.max(10, x - 25)}px`;
      popup.style.top = `${Math.max(10, y - 10)}px`;
      popup.style.color = TYPE_COLORS[type];
      popup.innerHTML = `<span class="text-xl">${number}</span> COMBO!`;

      boardGrid.appendChild(popup);
      setTimeout(() => {
        if (popup.parentNode) popup.parentNode.removeChild(popup);
      }, 700);
    }

    async function applyGravity() {
      let moved = false;

      for (let c = 0; c < COLS; c++) {
        let emptyRows = 0;
        for (let r = ROWS - 1; r >= 0; r--) {
          const orb = boardState.find(o => o.col === c && o.row === r);
          if (!orb) {
            emptyRows++;
          } else if (emptyRows > 0) {
            orb.row += emptyRows;
            moved = true;
          }
        }
      }

      if (moved) {
        sfx.playDrop();
        updateOrbPositions(true);
        await new Promise(resolve => setTimeout(resolve, 180));
      }
    }

    async function spawnSkyfallOrbs() {
      const newOrbs = [];

      for (let c = 0; c < COLS; c++) {
        const columnOrbs = boardState.filter(o => o.col === c);
        const missingCount = ROWS - columnOrbs.length;

        for (let i = 0; i < missingCount; i++) {
          const targetRow = missingCount - 1 - i;
          const type = ORB_TYPES[Math.floor(Math.random() * ORB_TYPES.length)];
          
          const orb = createOrbElement(type, -1 - i, c);
          orb.row = targetRow;
          newOrbs.push(orb);
          boardState.push(orb);
        }
      }

      if (newOrbs.length > 0) {
        await new Promise(resolve => setTimeout(resolve, 40));
        sfx.playDrop();
        updateOrbPositions(true);
        await new Promise(resolve => setTimeout(resolve, 220));
      }
    }

    btnGameStart.addEventListener('click', (e) => {
      e.stopPropagation();
      sfx.init();
      sfx.playDungeonBGM();

      startScreen.style.opacity = '0';
      setTimeout(() => {
        startScreen.style.display = 'none';
        initBoard();
      }, 400);
    });

    boardGrid.addEventListener('pointerdown', onPointerDown);

    btnReset.addEventListener('click', () => {
      initBoard();
    });

    btnToggleGrid.addEventListener('click', () => {
      if (isProcessingCombos) return;
      if (COLS === 6) {
        COLS = 7;
        ROWS = 6;
      } else {
        COLS = 6;
        ROWS = 5;
      }
      initBoard();
    });

    btnEditMode.addEventListener('click', () => {
      if (isProcessingCombos) return;
      isEditMode = !isEditMode;

      if (isEditMode) {
        btnEditMode.classList.add('btn-active');
        btnEditMode.innerHTML = '✔ DONE (編集完了)';
        editPalettePanel.classList.remove('hidden');
        editPalettePanel.classList.add('flex');
      } else {
        btnEditMode.classList.remove('btn-active');
        btnEditMode.innerHTML = '✏️ EDIT MODE (盤面編集)';
        editPalettePanel.classList.add('hidden');
        editPalettePanel.classList.remove('flex');
      }
    });

    document.querySelectorAll('.palette-item').forEach(item => {
      item.innerHTML = ORB_SVGS[item.dataset.type];
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.palette-item').forEach(i => i.classList.remove('selected'));
        const target = e.currentTarget;
        target.classList.add('selected');
        selectedPaintType = target.dataset.type;
      });
    });

    btnFillAll.addEventListener('click', () => {
      boardState.forEach(orb => {
        changeOrbType(orb, selectedPaintType);
      });
      sfx.playSwap();
    });

    timeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const val = parseFloat(e.dataset.time);
        setCustomMoveTime(val);
      });
    });

    timeInput.addEventListener('change', (e) => {
      setCustomMoveTime(e.target.value);
    });

    timeSlider.addEventListener('input', (e) => {
      setCustomMoveTime(e.target.value);
    });

    toggleNoSkyfall.addEventListener('change', (e) => {
      noSkyfall = e.target.checked;
      if (noSkyfall) {
        noSkyfallBadge.classList.remove('hidden');
      } else {
        noSkyfallBadge.classList.add('hidden');
      }
    });

    toggleBgm.addEventListener('change', (e) => {
      sfx.setBgmEnabled(e.target.checked);
    });

    window.addEventListener('resize', () => {
      calculateOrbSize();
      boardState.forEach(orb => {
        orb.element.style.width = `${orbSize - 4}px`;
        orb.element.style.height = `${orbSize - 4}px`;
      });
      updateOrbPositions(false);
    });
  </script>
</body>
</html>
